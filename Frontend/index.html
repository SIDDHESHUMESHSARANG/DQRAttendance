<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="DQRSmartAttendance" />
    <meta name="theme-color" content="#142b49" />
    <title>DQRSmartAttendance</title>
    <script>
      try {
        if (localStorage.getItem("dqr-theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
        }
      } catch (error) {
        console.warn("Unable to read the saved color theme.", error);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
